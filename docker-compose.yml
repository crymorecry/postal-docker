# Postal production stack for Coolify / Docker Compose
# Postal 3.3.7 — no RabbitMQ (removed in v3), no host networking, no Traefik labels.
# Coolify injects env vars and Traefik routing; no env_file or Traefik labels required.

x-postal-image: &postal-image
  image: ghcr.io/postalserver/postal:${POSTAL_VERSION:-3.3.7}
  # Official Postal image is amd64-only. Pin platform so ARM64 hosts pull amd64 via emulation.
  platform: linux/amd64

x-postal-healthcheck: &postal-healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

# Shared env for Postal services. Coolify auto-generates SERVICE_* secrets when declared on mariadb.
x-postal-env: &postal-env
  DATABASE_HOST: mariadb
  DATABASE_PORT: "3306"
  DATABASE_NAME: ${DATABASE_NAME:-postal}
  DATABASE_USER: ${DATABASE_USER:-postal}
  DATABASE_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
  DATABASE_ROOT_PASSWORD: ${SERVICE_PASSWORD_MARIADB_ROOT}
  SECRET_KEY: ${SERVICE_BASE64_64_SECRET}
  RAILS_ENV: ${RAILS_ENV:-production}
  POSTAL_HOSTNAME: ${POSTAL_HOSTNAME}
  POSTAL_WEB_HOST: ${POSTAL_WEB_HOST}
  POSTAL_SMTP_HOST: ${POSTAL_SMTP_HOST:-${POSTAL_WEB_HOST}}
  DNS_MX: ${DNS_MX:-mx1.${POSTAL_HOSTNAME}}
  DNS_SPF: ${DNS_SPF:-spf.${POSTAL_HOSTNAME}}
  DNS_DKIM_SELECTOR: ${DNS_DKIM_SELECTOR:-postal}
  DNS_RETURN_PATH: ${DNS_RETURN_PATH:-rp.${POSTAL_HOSTNAME}}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_FIRST_NAME: ${INITIAL_ADMIN_FIRST_NAME:-Admin}
  INITIAL_ADMIN_LAST_NAME: ${INITIAL_ADMIN_LAST_NAME:-User}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  WAIT_FOR_TIMEOUT: ${WAIT_FOR_TIMEOUT:-120}

# Shared settings for all long-running Postal processes
x-postal-common: &postal-common
  <<: *postal-image
  platform: linux/amd64
  environment:
    <<: *postal-env
    WAIT_FOR_TARGETS: mariadb:3306
  networks:
    - postal-net
  restart: unless-stopped
  volumes:
    - postal-config:/config:ro
    - postal-data:/opt/postal/data
    - postal-uploads:/opt/postal/uploads
    - postal-logs:/var/log/postal
  depends_on:
    mariadb:
      condition: service_healthy
    postal-init:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # MariaDB 10.11 LTS — main and message database backend
  # Declares Coolify magic vars so passwords/secrets are auto-generated on deploy.
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      SERVICE_PASSWORD_MARIADB_ROOT:
      SERVICE_PASSWORD_MARIADB:
      SERVICE_BASE64_64_SECRET:
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MARIADB_ROOT}
      MARIADB_DATABASE: ${DATABASE_NAME:-postal}
      MARIADB_USER: ${DATABASE_USER:-postal}
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/mariadb-init.sh:/docker-entrypoint-initdb.d/10-postal-grants.sh:ro
    networks:
      - postal-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # One-shot initializer: render config, generate signing key, migrate DB, admin
  # Bypasses Postal entrypoint — runs init.sh directly as root.
  # ---------------------------------------------------------------------------
  postal-init:
    <<: *postal-image
    platform: linux/amd64
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    environment:
      <<: *postal-env
    volumes:
      - ./config:/templates:ro
      - ./scripts:/scripts:ro
      - postal-config:/config
    networks:
      - postal-net
    depends_on:
      mariadb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Postal web UI — Coolify routes HTTPS via SERVICE_URL_POSTAL-WEB_5000
  # ---------------------------------------------------------------------------
  postal-web:
    <<: *postal-common
    command: postal web-server
    environment:
      <<: *postal-env
      WAIT_FOR_TARGETS: mariadb:3306
      SERVICE_URL_POSTAL-WEB_5000:
      BIND_ADDRESS: 0.0.0.0
      PORT: "5000"
    ports:
      - "5000"
    healthcheck:
      <<: *postal-healthcheck-defaults
      test: ["CMD", "/scripts/healthcheck.sh", "web"]
    volumes:
      - postal-config:/config:ro
      - postal-data:/opt/postal/data
      - postal-uploads:/opt/postal/uploads
      - postal-logs:/var/log/postal
      - ./scripts/healthcheck.sh:/scripts/healthcheck.sh:ro

  # ---------------------------------------------------------------------------
  # Postal background worker
  # ---------------------------------------------------------------------------
  postal-worker:
    <<: *postal-common
    command: postal worker
    healthcheck:
      <<: *postal-healthcheck-defaults
      test: ["CMD", "/scripts/healthcheck.sh", "worker"]
    volumes:
      - postal-config:/config:ro
      - postal-data:/opt/postal/data
      - postal-uploads:/opt/postal/uploads
      - postal-logs:/var/log/postal
      - ./scripts/healthcheck.sh:/scripts/healthcheck.sh:ro

  # ---------------------------------------------------------------------------
  # Postal SMTP — raw TCP ports (not routed through HTTP Traefik)
  # ---------------------------------------------------------------------------
  postal-smtp:
    <<: *postal-common
    command: postal smtp-server
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "25:25"
      - "587:25"
    healthcheck:
      <<: *postal-healthcheck-defaults
      test: ["CMD", "/scripts/healthcheck.sh", "smtp"]
    volumes:
      - postal-config:/config:ro
      - postal-data:/opt/postal/data
      - postal-uploads:/opt/postal/uploads
      - postal-logs:/var/log/postal
      - ./scripts/healthcheck.sh:/scripts/healthcheck.sh:ro

networks:
  postal-net:
    driver: bridge

volumes:
  mariadb-data:
  postal-config:
  postal-data:
  postal-uploads:
  postal-logs:
